<nav class="navbar navbar-expand-lg navbar-dark bg-dark" *ngIf="isLoggedIn">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="['/home']" >
      <img src="https://media.formula1.com/image/upload/f_auto,c_limit,w_90,q_auto/f_auto/q_auto/content/dam/fom-website/subscribe-to-f1/f1_logo_fallback"
           alt="F1 Logo" class="d-inline-block align-text-top me-2" style="height: 40px; width: 100%;">
      F1 Manager
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto" *ngIf="isLoggedIn">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/home']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/classifica']" routerLinkActive="active">
            Classifica
          </a>
        </li>
      </ul>
      
      <div class="d-flex align-items-center" *ngIf="isLoggedIn">
        <!-- Notifiche -->
        <div class="me-3">
          <app-notification-bell></app-notification-bell>
        </div>
        
        <!-- Profilo utente -->
        <div ngbDropdown class="d-inline-block" placement="bottom-end">
          <button class="btn btn-link text-light text-decoration-none d-flex align-items-center" 
                  type="button" id="userDropdown" ngbDropdownToggle>
            <i class="bi bi-person-circle me-1"></i>
            {{ user?.username || 'Utente' }}
          </button>
          <div ngbDropdownMenu aria-labelledby="userDropdown" class="dropdown-menu dropdown-menu-end">
            <a ngbDropdownItem [routerLink]="['/profilo']" class="dropdown-item">
              <i class="bi bi-person me-2"></i>Profilo
            </a>
            <div class="dropdown-divider"></div>
            <button ngbDropdownItem (click)="onLogout()" class="dropdown-item">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
