<div class="login-page">
  <video autoplay muted loop playsinline class="bg-video" #bgVideo>
    <source src="assets/videoplayback.mp4" type="video/mp4">
    Il tuo browser non supporta i video HTML5.
  </video>
  <div class="video-overlay"></div>
  
  <div class="login-container">
    <form (ngSubmit)="onSubmit()" class="login-form" #loginForm="ngForm">
    <h2>Accedi al tuo account</h2>
    
    <div class="form-group">
      <label for="username">Username</label>
      <div class="input-group">
<!--         <span class="input-group-text">
          <i class="bi bi-person-fill"></i>
        </span> -->
        <input 
          type="text" 
          id="username" 
          [(ngModel)]="username" 
          name="username" 
          required
          [disabled]="loading"
          class="form-control"
          placeholder="Inserisci il tuo username"
          autocomplete="username"
          autofocus
        >
      </div>
    </div>
    
    <div class="form-group">
      <div class="d-flex justify-content-between align-items-center">
        <label for="password">Password</label>
        <a href="#" class="forgot-password">Password dimenticata?</a>
      </div>
      <div class="input-group">
<!--         <span class="input-group-text">
          <i class="bi bi-lock-fill"></i>
        </span> -->
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password" 
          required
          [disabled]="loading"
          class="form-control"
          placeholder="Inserisci la tua password"
          autocomplete="current-password"
        >
      </div>
    </div>
    
    <button 
      type="submit" 
      [disabled]="loading || !loginForm.form.valid" 
      class="btn btn-primary"
      [class.btn-loading]="loading"
    >
      <span *ngIf="!loading">Accedi</span>
      <div *ngIf="loading" class="spinner-border" role="status">
        <span class="visually-hidden">Caricamento...</span>
      </div>
    </button>
    
    <div *ngIf="error" class="alert alert-danger">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      {{ error }}
    </div>
    
    <div class="divider">
      <span>oppure</span>
    </div>
    
    <button type="button" class="btn btn-outline-secondary" [disabled]="loading">
      <i class="bi bi-google me-2"></i>
      Accedi con Google
    </button>
    
    <p class="register-link text-center mt-4">
      Non hai un account? <a [routerLink]="['/register']" [class.disabled]="loading">Registrati</a>
    </p>
    </form>
  </div>
</div>
